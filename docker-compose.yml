version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forgecraft_db
    restart: always
    environment:
      POSTGRES_USER: forgecraft_user
      POSTGRES_PASSWORD: forgecraft_password
      POSTGRES_DB: forgecraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: forgecraft_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
